<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Hong Kong — Live Wallpaper</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #05061a;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #clock {
    position: fixed; top: 3.5vh; right: 3.5vw;
    color: #fff; text-align: right; user-select: none;
    text-shadow: 0 0 12px rgba(120,180,255,.9), 0 0 34px rgba(120,140,255,.55), 0 2px 6px rgba(0,0,0,.6);
    pointer-events: none;
  }
  #clock .time {
    font-size: min(7.5vw, 92px); font-weight: 600; letter-spacing: .04em; line-height: 1;
  }
  #clock .ampm {
    font-size: min(2vw, 24px); font-weight: 500; letter-spacing: .35em; margin-top: .35em; opacity: .92;
  }
  #clock .date {
    font-size: min(1.15vw, 15px); font-weight: 400; letter-spacing: .22em; margin-top: .55em; opacity: .8; text-transform: uppercase;
  }

  #micHint {
    position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%);
    color: rgba(255,255,255,.85); font-size: 14px; letter-spacing: .08em;
    background: rgba(10,14,40,.55); border: 1px solid rgba(140,170,255,.35);
    padding: 10px 18px; border-radius: 24px; cursor: pointer;
    backdrop-filter: blur(6px); transition: opacity .6s ease;
  }
  #micHint.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="clock">
  <div class="time" id="clockTime">--:--</div>
  <div class="ampm" id="clockAmpm">--</div>
  <div class="date" id="clockDate"></div>
</div>

<div id="micHint">Browser preview &mdash; set as a Wallpaper Engine / Lively wallpaper for system-audio reactivity</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  // ---------- Resize ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildSkyline();
  }
  window.addEventListener("resize", resize);

  // ---------- Sky gradient ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0.00, "#05061a");
    g.addColorStop(0.30, "#141a4d");
    g.addColorStop(0.55, "#4a2a7a");
    g.addColorStop(0.75, "#b0447e");
    g.addColorStop(0.92, "#ff8c4a");
    g.addColorStop(1.00, "#ffc46b");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // stars
    ctx.save();
    for (let i = 0; i < 90; i++) {
      const x = (Math.sin(i * 127.1) * .5 + .5) * W;
      const y = (Math.sin(i * 311.7) * .5 + .5) * H * 0.45;
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(perfNow * 0.0008 + i));
      ctx.globalAlpha = tw * 0.7;
      ctx.fillStyle = "#cfe0ff";
      ctx.fillRect(x, y, 1.6, 1.6);
    }
    ctx.restore();

    // moon glow
    const mg = ctx.createRadialGradient(W * 0.16, H * 0.18, 0, W * 0.16, H * 0.18, H * 0.22);
    mg.addColorStop(0, "rgba(220,230,255,.28)");
    mg.addColorStop(1, "rgba(220,230,255,0)");
    ctx.fillStyle = mg;
    ctx.fillRect(0, 0, W, H * 0.5);
  }

  // ---------- Skyline ----------
  let buildings = [];
  const NEON = ["#35d0ff", "#7a5cff", "#ff5cc8", "#5cffd0", "#ff9a3d", "#ff4a6a"];

  function buildSkyline() {
    buildings = [];
    const layers = 3;
    for (let L = 0; L < layers; L++) {
      const depth = L / (layers - 1);          // 0 = far, 1 = near
      const baseY = H * (0.62 + 0.16 * depth);
      const bw = (30 + 60 * depth) * (W / 1920 + 0.4);
      let x = -bw * Math.random();
      while (x < W + bw) {
        const w = bw * (0.55 + Math.random() * 0.9);
        const h = (H * 0.12 + Math.random() * H * (0.14 + 0.16 * depth));
        buildings.push({
          x, w, h, baseY, depth,
          color: NEON[Math.floor(Math.random() * NEON.length)],
          windows: Math.random(),
          seed: Math.random() * 1000
        });
        x += w + bw * 0.12 * Math.random();
      }
    }
    buildings.sort((a, b) => a.depth - b.depth);
  }

  function drawSkyline() {
    for (const b of buildings) {
      const top = b.baseY - b.h;
      const alpha = 0.25 + 0.75 * b.depth;

      // body
      ctx.fillStyle = `rgba(${8 + 14 * b.depth}, ${10 + 12 * b.depth}, ${30 + 22 * b.depth}, ${alpha})`;
      ctx.fillRect(b.x, top, b.w, b.h + (H - b.baseY));

      // neon edge
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10 + 14 * b.depth;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 1 + b.depth;
      ctx.strokeRect(b.x + .5, top + .5, b.w - 1, b.h - 1);
      ctx.restore();

      // windows
      const cols = Math.max(2, Math.floor(b.w / 12));
      const rows = Math.max(3, Math.floor(b.h / 16));
      const cw = b.w / cols, ch = b.h / rows;
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          const n = Math.sin(b.seed + c * 12.9898 + r * 78.233) * 43758.5453;
          const on = (n - Math.floor(n)) < 0.28 * b.windows;
          if (!on) continue;
          const flick = 0.5 + 0.5 * Math.sin(perfNow * 0.001 + Math.floor(n) * 7);
          ctx.globalAlpha = alpha * (0.35 + 0.55 * flick) * b.depth;
          ctx.fillStyle = b.color;
          ctx.fillRect(b.x + c * cw + cw * 0.25, top + r * ch + ch * 0.25, cw * 0.5, ch * 0.4);
        }
      }
      ctx.globalAlpha = 1;

      // antenna on some tall near buildings
      if (b.depth > 0.9 && b.h > H * 0.3) {
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w / 2, top);
        ctx.lineTo(b.x + b.w / 2, top - 22);
        ctx.stroke();
        const blink = Math.sin(perfNow * 0.004 + b.seed) > 0;
        ctx.fillStyle = blink ? "#ff4a6a" : "rgba(255,74,106,.2)";
        ctx.beginPath();
        ctx.arc(b.x + b.w / 2, top - 24, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---------- Water reflection ----------
  function drawWater() {
    const wy = H * 0.86;
    const g = ctx.createLinearGradient(0, wy, 0, H);
    g.addColorStop(0, "rgba(20,16,60,.9)");
    g.addColorStop(1, "rgba(5,4,20,1)");
    ctx.fillStyle = g;
    ctx.fillRect(0, wy, W, H - wy);

    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = "#7fd4ff";
    ctx.lineWidth = 1;
    for (let i = 0; i < 26; i++) {
      const y = wy + 6 + i * ((H - wy) / 26) * 1.1;
      const wob = Math.sin(perfNow * 0.0016 + i * 1.3) * 14;
      const len = 40 + Math.random() * 0 + (i % 5) * 30;
      const x = (Math.sin(i * 91.7) * .5 + .5) * W;
      ctx.beginPath();
      ctx.moveTo(x + wob, y);
      ctx.lineTo(x + wob + len, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- Audio visualizer (system audio) ----------
  const BARS = 96;
  const SYS_BINS = 128;                    // both Wallpaper Engine and Lively deliver 128 bins
  const sysData = new Float32Array(SYS_BINS);
  let sysAudio = false;
  const barLevels = new Float32Array(BARS);
  const barPeaks = new Float32Array(BARS);
  let idlePhase = 0;

  // Wallpaper Engine injects this global and calls our listener with 128
  // values (0..1) sampled from the system audio output loopback.
  if (typeof window.wallpaperRegisterAudioListener === "function") {
    window.wallpaperRegisterAudioListener((arr) => {
      for (let i = 0; i < SYS_BINS; i++) sysData[i] = arr[i] || 0;
      sysAudio = true;
      hideHint();
    });
  }

  // Lively Wallpaper calls livelyAudioListener(audioData) with 128 bins
  // of the selected audio source (default: system output).
  window.livelyAudioListener = (audioData) => {
    for (let i = 0; i < SYS_BINS; i++) sysData[i] = audioData[i] || 0;
    sysAudio = true;
    hideHint();
  };

  let hintHidden = false;
  function hideHint() {
    if (hintHidden) return;
    hintHidden = true;
    document.getElementById("micHint").classList.add("hidden");
  }

  function updateBars(dt) {
    if (sysAudio) {
      for (let i = 0; i < BARS; i++) {
        // logarithmic-ish sampling so lows don't hog the left side
        const t0 = Math.pow(i / BARS, 1.6);
        const t1 = Math.pow((i + 1) / BARS, 1.6);
        const a = Math.floor(t0 * SYS_BINS), b2 = Math.max(a + 1, Math.floor(t1 * SYS_BINS));
        let sum = 0;
        for (let j = a; j < b2; j++) sum += sysData[j];
        const v = (sum / (b2 - a));
        barLevels[i] += (v - barLevels[i]) * (v > barLevels[i] ? 0.55 : 0.12);
        if (barLevels[i] > barPeaks[i]) barPeaks[i] = barLevels[i];
        else barPeaks[i] -= dt * 0.35;
      }
    } else {
      idlePhase += dt;
      for (let i = 0; i < BARS; i++) {
        const v = 0.16
          + 0.13 * Math.sin(idlePhase * 1.5 + i * 0.28)
          + 0.07 * Math.sin(idlePhase * 0.7 + i * 0.11);
        barLevels[i] += (Math.max(0.02, v) - barLevels[i]) * 0.1;
        if (barLevels[i] > barPeaks[i]) barPeaks[i] = barLevels[i];
        else barPeaks[i] -= dt * 0.35;
      }
    }
  }

  function drawBars() {
    const baseY = H * 0.72;
    const bw = W / BARS;
    for (let i = 0; i < BARS; i++) {
      const v = barLevels[i];
      const h = Math.max(3, v * H * 0.42);
      const x = i * bw;
      const hue = 200 + (i / BARS) * 160;   // cyan -> magenta -> orange sweep
      const g = ctx.createLinearGradient(0, baseY - h, 0, baseY);
      g.addColorStop(0, `hsla(${hue}, 100%, 65%, .95)`);
      g.addColorStop(1, `hsla(${hue}, 100%, 55%, .12)`);
      ctx.fillStyle = g;
      ctx.shadowColor = `hsla(${hue}, 100%, 60%, .9)`;
      ctx.shadowBlur = 12;
      const pad = Math.max(1, bw * 0.18);
      ctx.fillRect(x + pad, baseY - h, bw - pad * 2, h);

      // peak cap
      const py = baseY - Math.max(3, barPeaks[i] * H * 0.42) - 4;
      ctx.shadowBlur = 0;
      ctx.fillStyle = `hsla(${hue}, 100%, 80%, .9)`;
      ctx.fillRect(x + pad, py, bw - pad * 2, 2);
    }
    ctx.shadowBlur = 0;

    // haze along the bar line
    const hz = ctx.createLinearGradient(0, baseY - H * 0.45, 0, baseY);
    hz.addColorStop(0, "rgba(60,40,120,0)");
    hz.addColorStop(1, "rgba(60,40,120,.25)");
    ctx.fillStyle = hz;
    ctx.fillRect(0, baseY - H * 0.45, W, H * 0.45);
  }

  // ---------- Clock ----------
  const elTime = document.getElementById("clockTime");
  const elAmpm = document.getElementById("clockAmpm");
  const elDate = document.getElementById("clockDate");
  function updateClock() {
    const d = new Date();
    let hr = d.getHours();
    const ampm = hr >= 12 ? "PM" : "AM";
    hr = hr % 12; if (hr === 0) hr = 12;
    const mn = String(d.getMinutes()).padStart(2, "0");
    elTime.textContent = `${hr}:${mn}`;
    elAmpm.textContent = ampm;
    elDate.textContent = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  // ---------- Main loop ----------
  let perfNow = 0, lastT = 0;
  function frame(t) {
    perfNow = t;
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
    lastT = t;

    updateBars(dt);
    drawSky();
    drawBars();
    drawSkyline();
    drawWater();

    requestAnimationFrame(frame);
  }

  updateClock();
  setTimeout(hideHint, 9000);
  setInterval(updateClock, 1000);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
