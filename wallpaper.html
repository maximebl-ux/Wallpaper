<title>Neon Hong Kong — Live Wallpaper</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #05061a;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #clock {
    position: fixed; top: 2.6vh; right: 3.2vw;
    color: #fff; text-align: right; user-select: none;
    text-shadow: 0 0 10px rgba(255,255,255,.55), 0 0 28px rgba(160,180,255,.45), 0 2px 6px rgba(0,0,0,.5);
    pointer-events: none;
  }
  #clock .time {
    font-size: min(4.6vw, 62px); font-weight: 600; letter-spacing: .02em; line-height: 1;
    white-space: nowrap;
  }
  #clock .date {
    font-size: min(1.05vw, 14px); font-weight: 400; letter-spacing: .18em; margin-top: .5em; opacity: .85;
  }

  #hint {
    position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%);
    color: rgba(255,255,255,.85); font-size: 14px; letter-spacing: .08em;
    background: rgba(10,14,40,.55); border: 1px solid rgba(140,170,255,.35);
    padding: 10px 18px; border-radius: 24px;
    backdrop-filter: blur(6px); transition: opacity .6s ease;
  }
  #hint.hidden { opacity: 0; pointer-events: none; }
  #hint:hover { background: rgba(30,40,90,.7); }
</style>
</head>

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  // ---------- Background (cover fit) ----------
  function drawBackground() {
    ctx.fillStyle = "#05061a";
    ctx.fillRect(0, 0, W, H);
    if (!bgReady) return;
    const ir = bgImg.width / bgImg.height, sr = W / H;
    let dw, dh;
    if (sr > ir) { dw = W; dh = W / ir; }
    else { dh = H; dw = H * ir; }
    ctx.drawImage(bgImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
  }

  // ---------- Audio input: system audio ----------
  const BARS = 128;
  const SYS_BINS = 128;
  const sysData = new Float32Array(SYS_BINS);
  let sysAudio = false;
  const barLevels = new Float32Array(BARS);
  const barPeaks = new Float32Array(BARS);
  let idlePhase = 0;

  // Lively Wallpaper: called automatically with system-audio FFT (128 bins, 0..1)
  // once the wallpaper's Audio Source is set to the output device.
  window.livelyAudioListener = (audioData) => {
    for (let i = 0; i < SYS_BINS; i++) sysData[i] = audioData[i] || 0;
    sysAudio = true;
    hideHint();
  };

  // Wallpaper Engine: system audio loopback.
  if (typeof window.wallpaperRegisterAudioListener === "function") {
    window.wallpaperRegisterAudioListener((arr) => {
      for (let i = 0; i < SYS_BINS; i++) sysData[i] = arr[i] || 0;
      sysAudio = true;
      hideHint();
    });
  }

  // Browser preview fallback: capture a Chrome tab's audio via screen share.
  let browserAnalyser = null, browserData = null;
  async function captureTabAudio() {
    if (browserAnalyser) return;
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      const at = stream.getAudioTracks()[0];
      if (!at) {
        document.getElementById("hint").textContent = "No audio shared - pick a Chrome TAB and check 'share tab audio'";
        return;
      }
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const src = ac.createMediaStreamSource(new MediaStream([at]));
      browserAnalyser = ac.createAnalyser();
      browserAnalyser.fftSize = 512;
      browserAnalyser.smoothingTimeConstant = 0.8;
      src.connect(browserAnalyser);
      browserData = new Uint8Array(browserAnalyser.frequencyBinCount);
      stream.getVideoTracks().forEach(t => t.stop());
      hideHint();
    } catch (e) { /* user cancelled */ }
  }
  document.getElementById("hint").addEventListener("click", captureTabAudio);

  let hintHidden = false;
  function hideHint() {
    if (hintHidden) return;
    hintHidden = true;
    document.getElementById("hint").classList.add("hidden");
  }

  // Overall loudness (0..1) used to scale the bounce.
  let loudness = 0;
  function updateBars(dt) {
    if (!sysAudio && browserAnalyser) {
      browserAnalyser.getByteFrequencyData(browserData);
      const usable = Math.floor(browserData.length * 0.78);
      for (let i = 0; i < SYS_BINS; i++) sysData[i] = browserData[Math.floor(i / SYS_BINS * usable)] / 255;
      sysAudio = true;
    }

    let sum = 0;
    if (sysAudio) {
      for (let i = 0; i < BARS; i++) {
        const t0 = Math.pow(i / BARS, 1.6);
        const t1 = Math.pow((i + 1) / BARS, 1.6);
        const a = Math.floor(t0 * SYS_BINS), b2 = Math.max(a + 1, Math.floor(t1 * SYS_BINS));
        let s = 0;
        for (let j = a; j < b2; j++) s += sysData[j];
        const v = (s / (b2 - a));
        barLevels[i] += (v - barLevels[i]) * (v > barLevels[i] ? 0.55 : 0.12);
        if (barLevels[i] > barPeaks[i]) barPeaks[i] = barLevels[i];
        else barPeaks[i] -= dt * 0.35;
        sum += v;
      }
      loudness += (Math.min(1, sum / BARS * 2.2) - loudness) * 0.25;
    } else {
      idlePhase += dt;
      for (let i = 0; i < BARS; i++) {
        const v = 0.10
          + 0.09 * Math.sin(idlePhase * 1.5 + i * 0.22)
          + 0.05 * Math.sin(idlePhase * 0.7 + i * 0.09);
        barLevels[i] += (Math.max(0.015, v) - barLevels[i]) * 0.1;
        if (barLevels[i] > barPeaks[i]) barPeaks[i] = barLevels[i];
        else barPeaks[i] -= dt * 0.35;
      }
    }
  }

  // ---------- Bars rise from the skyline into the sky ----------
  function drawBars() {
    const baseY = H * 0.68;                 // horizon / skyline base
    const bw = W / BARS;
    const boost = 0.85 + loudness * 0.5;   // louder sound = bigger bounce
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < BARS; i++) {
      const v = barLevels[i];
      const h = Math.max(2, v * H * 0.48 * boost);
      const x = i * bw;
      const g = ctx.createLinearGradient(0, baseY - h, 0, baseY);
      g.addColorStop(0, "rgba(255,255,255,.75)");
      g.addColorStop(0.25, "rgba(180,200,255,.5)");
      g.addColorStop(1, "rgba(120,140,255,.05)");
      ctx.fillStyle = g;
      const pad = Math.max(0.8, bw * 0.32);
      ctx.fillRect(x + pad, baseY - h, Math.max(1, bw - pad * 2), h);

      const py = baseY - Math.max(2, barPeaks[i] * H * 0.48 * boost) - 3;
      ctx.fillStyle = "rgba(255,255,255,.8)";
      ctx.fillRect(x + pad, py, Math.max(1, bw - pad * 2), 1.5);
    }
    ctx.restore();
  }

  // ---------- Clock ----------
  const elTime = document.getElementById("clockTime");
  const elDate = document.getElementById("clockDate");
  function updateClock() {
    const d = new Date();
    let hr = d.getHours();
    const ampm = hr >= 12 ? "PM" : "AM";
    hr = hr % 12; if (hr === 0) hr = 12;
    const mn = String(d.getMinutes()).padStart(2, "0");
    elTime.textContent = `${hr}:${mn} ${ampm}`;
    elDate.textContent = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  // ---------- Main loop ----------
  let lastT = 0;
  function frame(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
    lastT = t;

    updateBars(dt);
    drawBackground();
    drawBars();

    requestAnimationFrame(frame);
  }

  updateClock();
  setInterval(updateClock, 1000);
  setTimeout(hideHint, 12000);
  resize();
  requestAnimationFrame(frame);
})();
