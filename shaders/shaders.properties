# ============================================================
#  Neon Horizons - a dawn/dusk neon skyline shader pack
#  Format: OptiFine-compatible / Iris shader pack (shaders/)
#  Loader: Iris 1.11.x for Minecraft 26.2 (Fabric)
# ============================================================

# Vanilla features replaced or disabled by the pack
clouds=off
sun=false
moon=false
underwaterOverlay=false

# ---- Screen layout -------------------------------------------------
screen=<profile> <empty> [SHADOW] [LIGHT] [WATER] [ATMOSPHERE] [POST]

screen.SHADOW=SHADOWS SHADOW_COLOR shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS SHADOW_DISTORT_STRENGTH sunPathRotation
screen.LIGHT=AO_STRENGTH SSAO SSAO_STRENGTH MIN_LIGHT EMISSIVE_STRENGTH BLOCKLIGHT_TINT
screen.WATER=WATER_QUALITY WATER_WAVE_SIZE WATER_WAVE_SPEED WATER_SPECULAR
screen.ATMOSPHERE=ATMOSPHERE FOG_DENSITY VOLUMETRIC_LIGHT CLOUD_QUALITY CLOUD_COVERAGE STAR_BRIGHTNESS RAIN_FOG
screen.POST=BLOOM BLOOM_STRENGTH BLOOM_THRESHOLD EXPOSURE SATURATION CONTRAST DITHERING

sliders=shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS SHADOW_DISTORT_STRENGTH AO_STRENGTH SSAO_STRENGTH MIN_LIGHT EMISSIVE_STRENGTH WATER_QUALITY WATER_WAVE_SIZE WATER_WAVE_SPEED FOG_DENSITY VOLUMETRIC_LIGHT CLOUD_QUALITY CLOUD_COVERAGE STAR_BRIGHTNESS BLOOM_STRENGTH BLOOM_THRESHOLD EXPOSURE SATURATION CONTRAST

# ---- Presets -------------------------------------------------------
# BALANCED ships as the compiled-in default (tuned for RTX 3050 6 GB @ 4K).
profile.PERFORMANCE=shadowMapResolution=1024 shadowDistance=96.0 SHADOW_FILTER=1 SHADOW_SOFTNESS=0.75 !SHADOW_COLOR !SSAO WATER_QUALITY=1 VOLUMETRIC_LIGHT=0 CLOUD_QUALITY=1
profile.BALANCED=shadowMapResolution=2048 shadowDistance=160.0 SHADOW_FILTER=2 SHADOW_SOFTNESS=1.0 SHADOW_COLOR SSAO SSAO_STRENGTH=0.6 WATER_QUALITY=2 VOLUMETRIC_LIGHT=1 CLOUD_QUALITY=2 CLOUD_COVERAGE=0.5
profile.HIGH=shadowMapResolution=3072 shadowDistance=224.0 SHADOW_FILTER=3 SHADOW_SOFTNESS=1.0 SHADOW_COLOR SSAO SSAO_STRENGTH=0.7 WATER_QUALITY=3 VOLUMETRIC_LIGHT=2 CLOUD_QUALITY=2 CLOUD_COVERAGE=0.5
profile.ULTRA=shadowMapResolution=4096 shadowDistance=320.0 SHADOW_FILTER=3 SHADOW_SOFTNESS=1.5 SHADOW_COLOR SSAO SSAO_STRENGTH=0.8 WATER_QUALITY=3 VOLUMETRIC_LIGHT=2 CLOUD_QUALITY=2 CLOUD_COVERAGE=0.55

# ---- Bloom buffer (quarter res) ------------------------------------
size.buffer.colortex3=0.25 0.25
