# ============================================================
#  Neon Skyline — pack configuration (Iris / OptiFine format)
# ============================================================

# Quality profiles (at least two presets)
profile.POTATO = SHADOW_QUALITY=0 SSR_STEPS=0 WATER_REFLECT=0 BLOOM=0
profile.BALANCED = SHADOW_QUALITY=1 SSR_STEPS=16 SSR_REFINE=0 WATER_REFLECT=1 BLOOM=1
profile.CINEMATIC = SHADOW_QUALITY=2 SSR_STEPS=32 SSR_REFINE=1 WATER_REFLECT=1 BLOOM=1

# Settings menu layout
screen = <profile> <empty> [SHADOWS_SCREEN] [WATER_SCREEN] [ATMOSPHERE_SCREEN] [POST_SCREEN]

screen.SHADOWS_SCREEN = SHADOW_QUALITY SHADOW_RES
screen.WATER_SCREEN = WATER_REFLECT WATER_REFLECTIVITY SSR_STEPS SSR_REFINE RIPPLE_HEIGHT
screen.ATMOSPHERE_SCREEN = FOG_DENSITY STAR_BRIGHTNESS
screen.POST_SCREEN = BLOOM BLOOM_STRENGTH EXPOSURE SATURATION CONTRAST VIGNETTE

# Numeric options rendered as sliders
sliders = WATER_REFLECTIVITY RIPPLE_HEIGHT BLOOM_STRENGTH FOG_DENSITY STAR_BRIGHTNESS EXPOSURE SATURATION CONTRAST
